<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>SysAI Blog – Admin</title>
</head>
<body>
  <div id="nc-root"></div>
  <div id="cf-deploy-bar" style="position:fixed;bottom:14px;right:16px;z-index:999999;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;font-size:12px;padding:8px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;border:1px solid #334155;box-shadow:0 4px 14px rgba(0,0,0,0.4);">
    <span id="cf-deploy-status">⏳ Prüfe Live-Status...</span>
    <a href="[https://sysai.sh/](https://sysai.sh/)" target="_blank" style="color:#38bdf8;text-decoration:none;">Live-Blog öffnen ↗</a>
  </div>
  <script type="module">
    try {
      await import('[https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js](https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js)');
    } catch (e) {
      await import('[https://cdn.jsdelivr.net/npm/@sveltia/cms/dist/sveltia-cms.js](https://cdn.jsdelivr.net/npm/@sveltia/cms/dist/sveltia-cms.js)');
    }
  </script>
  <script>
    (async function checkDeploy() {
      const el = document.getElementById('cf-deploy-status');
      try {
        const res = await fetch('/deploy-info.json?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          const info = await res.json();
          el.innerHTML = `<strong>🟢 Live</strong> &nbsp;(${info.builtAt}) — <em>${info.commit}</em>`;
        } else {
          el.innerHTML = '<strong>🟡 Build läuft…</strong>';
        }
      } catch (e) {
        el.textContent = 'ℹ️ Live-Status aktuell nicht abrufbar';
      }
      setTimeout(checkDeploy, 15000);
    })();
  </script>
</body>
</html>
