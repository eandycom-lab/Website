backend:
  name: turbo-github
  turbo_site_id: 588a0ec9-e0a6-4570-be56-043a987e85db

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog-Artikel"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Linux & OS", "Self-Hosting", "Local AI", "Home Automation", "Cloud & Dev"], default: "Self-Hosting", required: false }
      - { label: "Pub Date", name: "pubDate", widget: "datetime" }
      - { label: "Hero Image", name: "heroImage", widget: "image", default: "/blog-placeholder-1.jpg", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Website-Einstellungen"
    files:
      - name: "general"
        label: "Allgemein & Sidebar"
        file: "src/data/settings.json"
        fields:
          - { label: "Blog-Name (oben links)", name: "siteTitle", widget: "string" }
          - { label: "SEO-Kurzbeschreibung", name: "siteDescription", widget: "string" }
          - { label: "Sidebar: Über-Box Titel", name: "aboutTitle", widget: "string" }
          - { label: "Sidebar: Über-Box Foto", name: "aboutImage", widget: "image", required: false }
          - { label: "Sidebar: Über-Box Text", name: "aboutText", widget: "text" }
          - { label: "Kategorien (Sidebar)", name: "categories", widget: "list" }