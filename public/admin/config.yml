backend:
  name: github
  repo: eandycom-lab/Website
  branch: main
  base_url: https://sysai.sh
  auth_endpoint: /api/auth

media_folder: "public/images"
public_folder: "/images"
site_url: https://sysai.sh
display_url: https://sysai.sh
locale: "de"

collections:
  - name: "blog"
    label: "Blog-Artikel"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Beschreibung (SEO)", name: "description", widget: "text" }
      - { label: "Ver?ffentlichungsdatum", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Aktualisiert am", name: "updatedDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Hero-Bild", name: "heroImage", widget: "image", required: false }
      - label: "Kategorie"
        name: "category"
        widget: "select"
        options: ["Linux & OS", "Self-Hosting", "Local AI", "Home Automation"]
        default: "Self-Hosting"
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Inhalt", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Blog-Einstellungen"
    files:
      - label: "Allgemein & Sidebar"
        name: "general"
        file: "src/data/settings.json"
        fields:
          - { label: "Blog-Titel", name: "siteTitle", widget: "string" }
          - { label: "Beschreibung", name: "siteDescription", widget: "string" }
          - { label: "?ber-Box Titel", name: "aboutTitle", widget: "string" }
          - { label: "?ber-Box Bild", name: "aboutImage", widget: "image" }
          - { label: "?ber-Box Text", name: "aboutText", widget: "text" }
          - { label: "Kategorien", name: "categories", widget: "list" }
