backend:
  name: turbo-github
  turbo_site_id: 588a0ec9-e0a6-4570-be56-043a987e85db

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Linux & OS", "Self-Hosting", "Local AI", "Home Automation", "Cloud & Dev"], default: "Self-Hosting", required: false }
      - { label: "Pub Date", name: "pubDate", widget: "datetime" }
      - { label: "Hero Image", name: "heroImage", widget: "image", default: "/blog-placeholder-1.jpg", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
